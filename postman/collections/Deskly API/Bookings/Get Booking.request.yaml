$kind: http-request
name: Get Booking
order: 3000
url: 'http://localhost:4000/bookings/:bookingId'
method: GET
headers:
  - key: X-API-Key
    value: demo-key
pathVariables:
  - key: bookingId
    value: bkg_seed01
    description: 'ID of the booking to fetch (bkg_seed01 is seeded on server start)'
